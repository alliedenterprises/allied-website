name: Allied Website - Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js Standalone
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare standalone deployment package
        shell: pwsh
        run: |
          if (!(Test-Path ".next/standalone/server.js")) {
            throw "Standalone server.js was not generated."
          }

          New-Item -ItemType Directory -Force -Path "deploy-package" | Out-Null

          Copy-Item ".next/standalone/*" "deploy-package/" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "deploy-package/.next/static" | Out-Null

          Copy-Item ".next/static/*" "deploy-package/.next/static/" -Recurse -Force

          if (Test-Path "public") {
            Copy-Item "public" "deploy-package/public" -Recurse -Force
          }

          Write-Host "Standalone deployment package prepared."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: allied-website-standalone
          path: deploy-package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  transfer-to-ec2:
    name: Transfer Artifact to EC2
    needs: build
    runs-on: [self-hosted, windows, allied-production]
    timeout-minutes: 10

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: allied-website-standalone
          path: ${{ runner.temp }}\allied-website-artifact

      - name: Transfer artifact to staging directory
        shell: powershell
        run: |
          $source = "${{ runner.temp }}\allied-website-artifact"
          $destination = "C:\DO NOT DELETE\Allied-web\deployment\incoming"

          if (!(Test-Path "$source\server.js")) {
            throw "Standalone server.js not found in downloaded artifact."
          }

          if (!(Test-Path "$source\.next\static")) {
            throw "Next.js static files not found."
          }

          Get-ChildItem -LiteralPath $destination -Force |
            Remove-Item -Recurse -Force

          robocopy $source $destination /E /COPY:DAT /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
            throw "Artifact transfer failed. Robocopy exit code: $LASTEXITCODE"
          }

          if (!(Test-Path "$destination\server.js")) {
            throw "Artifact transfer verification failed."
          }

          Write-Host "Artifact successfully transferred to EC2 staging."
          Write-Host "Files: $((Get-ChildItem $destination -Recurse -File).Count)"